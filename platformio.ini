; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Minimal WiFi + OTA template
default_envs = az-delivery-devkit-v4-usb
extra_configs = ../_secrets/platformio_override.ini

[env:az-delivery-devkit-v4-usb]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_flags =
  -I src/app
  -I src/config
  -I src/contracts
  -I src/domain
  -I src/infrastructure
  -I ../_secrets

lib_deps = 
  ArduinoOTA

[env:az-delivery-devkit-v4-ota]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
upload_protocol = espota
; Upload port: Set IP address of ESP32 here or pass via CLI: -o upload_port=192.168.X.X
upload_speed = 921600
build_flags =
  -I src/app
  -I src/config
  -I src/contracts
  -I src/domain
  -I src/infrastructure
  -I ../_secrets

lib_deps = 
  ArduinoOTA

[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
  -I src/domain
